name: Aktualizacja

on:
  schedule:
    - cron: "23 4 * * *"  # codziennie 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja eli2md
        run: pip install "eli2md @ git+https://github.com/PolskiAgentW/eli2md@v0.4.0"
      - name: Nowe i zmienione akty
        run: python -m eli2md.dataset --root . --jobs 2 --max 400 --time-budget 7200
      - name: Statystyki w README
        run: python .github/stats.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Bez zmian."; exit 0; fi
          n=$(git diff --cached --name-only -- DU | wc -l)
          git commit -q -m "Aktualizacja $(date -u +%Y-%m-%d): zmienione pliki aktów: $n"
          git push
